name: Deploy 2233 Web Console

on:
  push:
    branches: ["main"]
    paths:
      - "web-console/**"
      - "amazon-sp-api.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "2233-web-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi

      - name: Build safe frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f web-console/index.html
          test -f web-console/styles.css
          test -f web-console/app.js
          test -f web-console/ui-text.js
          test -f web-console/data/snapshots.js
          test -f web-console/_headers
          for file in web-console/*.js web-console/data/*.js; do
            node --check "$file"
          done
          node tools/verify-ui-registry.mjs
          node tools/verify-web-console-static-copy.mjs
          node --test web-console/tests/*.test.mjs

          rm -rf dist
          mkdir -p dist
          cp -R web-console/. dist/

          if [ -f amazon-sp-api.html ]; then
            cp amazon-sp-api.html dist/amazon-sp-api.html
          fi

          printf 'User-agent: *\nDisallow:\n' > dist/robots.txt
          test -f dist/_headers
          grep -q 'Content-Security-Policy:' dist/_headers

          echo "Approved frontend artifact:"
          find dist -type f -maxdepth 3 -printf '%P\n' | sort

      - name: Deploy latest 2233 Web Console
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name=2233-web-agent --branch=main --commit-dirty=true
          echo "Stable URL: https://2233-web-agent.pages.dev"

      - name: Verify deployed homepage
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS --retry 2 --retry-delay 2 https://2233-web-agent.pages.dev/ | grep -q '1122 亚马逊智能经营系统'; then
              echo "Deployment smoke test: PASS"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment smoke test failed" >&2
          exit 1

      - name: Check 2233 custom domain (non-blocking)
        shell: bash
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://2233.sorilo-uk.com/ || echo 000)
          echo "2233.sorilo-uk.com -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::2233.sorilo-uk.com is not serving yet. Attach the custom domain to the 2233-web-agent Pages project in Cloudflare."
          fi

# deployment marker: web-console-v2
